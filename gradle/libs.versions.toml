[versions]
agp = "8.9.1"
coreKtx = "1.15.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.10.0"
kotlin = "2.1.0"
composeBom = "2025.02.00"
coil = "3.1.0"
navigation3 = "1.0.0"
hilt = "2.54"
hiltNavigationCompose = "1.3.0"
datastore = "1.1.2"
room = "2.6.1"
serialization = "1.8.0"
retrofit = "2.11.0"
okhttp = "4.12.0"
coroutines = "1.10.1"
ksp = "2.1.0-1.0.29"
junitJunit = "4.12"
mockk = "1.14.9"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# Icons-extended
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

#Images (Coil)
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

#Navigation3#############################
#lógica central de navegación (backstack, rutas, estado)
navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3" }
#componentes de UI (NavDisplay, animaciones entre pantallas)
navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3" }

#Hilt################################
##Inyección de dependencias, provee y gestiona el ciclo de vida de las dependencias
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
##Procesa las anotaciones @HiltViewModel, @Inject, @Module en tiempo de compilación
hilt-compiler-ksp = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
##hiltViewModel() en Compose para obtener ViewModels inyectados con Hilt
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
#Deprecado---funcionalidad integrada en hilt-navigation-compose
hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "hiltNavigationCompose" }

#DataStore
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

#Room
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler-ksp = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

#Serialization
#librería que hace el trabajo real de parsear JSON--hace el parseo JSON real
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

#Retrofit###################################
# cliente HTTP principal--gestiona endpoints y suspend functions
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
# convierte JSON a data classes de Kotlin automáticamente--le dice a Retrofit "usa kotlinx para parsear"
converter-kotlinx-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
# motor HTTP que usa Retrofit internamente--hace la petición HTTP
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
# interceptor para ver en Logcat las peticiones y respuestas (muy útil en desarrollo)
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

#Coroutines##################################
#base de coroutines (launch, async, Flow, etc.)
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
#dispatcher principal (Dispatchers.Main) para Android
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
#Para los tests de la coroutines (Unit Test)
kotlinx-coroutines-test = {group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines"}

#Lifecycle##################################
#viewModel() en Compose + viewModelScope
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
#collectAsStateWithLifecycle() para consumir Flows de forma segura en Compose
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
junit-junit = { group = "junit", name = "junit", version.ref = "junitJunit" }

#Mock (Testing)
mockk = {group = "io.mockk", name = "mockk", version = "mockk"}

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" } # crea la APK
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" } # habilita Compose

kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" } # habilita Kotlin
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" } #kotlinx-serialization
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }#Procesador de anotaciones moderno, reemplaza kapt (más rápido)
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" } #Habilita las anotaciones de Hilt (@HiltViewModel, @Module, etc)
